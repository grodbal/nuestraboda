  <title>Página no encontrada | Nuestra Boda</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Italiana&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#161512;--ivory:#f4f0e8;--wine:#6f2e36;--gold:#c7aa72;--muted:#746f66}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:25px;background:var(--ivory);color:var(--ink);font-family:'DM Sans',sans-serif;overflow:hidden}
    body::before,body::after{content:"";position:fixed;border:1px solid rgba(111,46,54,.14);border-radius:50%;pointer-events:none}
    body::before{width:520px;height:520px;left:-260px;top:-280px;box-shadow:0 0 0 95px rgba(111,46,54,.025)}
    body::after{width:650px;height:650px;right:-350px;bottom:-420px;box-shadow:0 0 0 110px rgba(199,170,114,.035)}
    main{position:relative;z-index:2;width:min(780px,100%);text-align:center}
    .mark{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 38px;border:1px solid currentColor;border-radius:50%;font-family:'Italiana',serif;font-size:20px}
    .code{margin:0;color:var(--wine);font-size:10px;font-weight:600;letter-spacing:.28em;text-transform:uppercase}
    h1{margin:22px 0 0;font-family:'Italiana',serif;font-size:clamp(56px,10vw,118px);font-weight:400;line-height:.9;letter-spacing:-.05em}
    p{max-width:560px;margin:28px auto 0;color:var(--muted);font-size:18px;line-height:1.65}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:54px;margin-top:36px;padding:0 24px;background:var(--ink);color:var(--ivory);border:1px solid var(--ink);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;transition:.3s ease}
    a:hover{background:var(--wine);border-color:var(--wine);transform:translateY(-3px)}
  </style>
</head>
<body>
  <main>
    <div class="mark">NB</div>
    <p class="code">Error 404</p>
    <h1>Este enlace no llegó al altar.</h1>
    <p>La página o invitación que buscas no está disponible. Revisa el enlace o vuelve al inicio de Nuestra Boda.</p>
    <a href="/">Volver al inicio →</a>
  </main>
</body>
